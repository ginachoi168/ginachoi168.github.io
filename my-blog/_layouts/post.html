---
layout: default
---
<article class="article">
  <a href="{{ '/' | relative_url }}">← Back to index</a>

  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <p>{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="article-content">
    {{ content }}
  </div>
</article>
