<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">Index</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      © {{ 'now' | date: "%Y" }} {{ site.title }}
    </footer>
  </div>
</body>
</html>
