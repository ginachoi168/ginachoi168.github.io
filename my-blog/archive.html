<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header>
        <h1>{{ site.title }}</h1>
        <nav>
            <a href="{{ site.baseurl }}/index.html">Home</a>
            <a href="{{ site.baseurl }}/about.html">About</a>
            <a href="{{ site.baseurl }}/archive.html">Archive</a>
        </nav>
    </header>
    <main>
        <h2>Archive</h2>
        <p>All posts are listed below.</p>
        {% for post in site.posts %}
        <article>
            <h3><a href="{{ site.baseurl }}/post.html">{{ post.title }}</a></h3>
            <time>{{ post.date | date: "%B %d, %Y" }}</time>
        </article>
        {% endfor %}
    </main>
    <footer>
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    </footer>
</body>
</html>
